/* Menu et fil d'Ariane collés en haut de la page pendant le scroll */
nav.navbar.navbar-flat { position: sticky; top: 0; z-index: 1030; }
/* Icônes (A+, imprimer...) à droite, sur la ligne du fil d'Ariane */
#iconsNews { padding-top: 8px; }
.breadcrumb-sticky { position: sticky; top: var(--navbar-height, 50px); z-index: 1020; background: #fff; }
/* Les liens d'ancre (#date, #top) ne doivent pas atterrir sous les deux barres */
html { scroll-padding-top: calc(var(--navbar-height, 50px) + var(--breadcrumb-height, 40px)); }
/* Frise chronologique à droite : décennies, la décennie en cours est dépliée et l'année en cours est mise en avant */
#timeline { display: none; }
@media (min-width: 1280px) {
	#timeline { display: block; position: fixed; right: 8px; z-index: 1010; text-align: right; font-size: 11px; line-height: 1.5;
		top: calc(var(--navbar-height, 50px) + var(--breadcrumb-height, 40px) + (100vh - var(--navbar-height, 50px) - var(--breadcrumb-height, 40px)) / 2);
		transform: translateY(-50%); max-height: calc(100vh - var(--navbar-height, 50px) - var(--breadcrumb-height, 40px) - 24px);
		overflow-y: auto; scrollbar-width: none; }
}
#timeline::-webkit-scrollbar { display: none; }
#timeline ul { list-style: none; margin: 0; padding: 0; }
/* Taille et opacité (--tl-size, --tl-opacity) posées en JS selon la distance à l'année en cours : effet de zoom */
#timeline a { display: block; padding: 1px 4px; color: #00103e; font-size: var(--tl-size, 11px); opacity: var(--tl-opacity, .3); text-decoration: none; transition: opacity .2s, font-size .2s; }
#timeline a:hover, #timeline a:focus { opacity: 1; text-decoration: none; }
#timeline .tl-decade > ul { display: none; }
#timeline .tl-decade.active > ul { display: block; }
#timeline .tl-decade.active > a, #timeline a.tl-year.active { font-weight: bold; }
</style>

<script>
// Cette page est dans /musee/files/ (pas de /fr/) : getPage() renvoie alors l'URL complète pour le lien du menu
// mais seulement le chemin pour la page courante, et le fil d'Ariane / l'élément actif du menu ne sont pas trouvés.
// On retire le domaine pour que les deux soient comparés sur le chemin.
(function() {
	var originalGetPage = getPage;
	getPage = function(lien) {
		return originalGetPage(lien.replace(/^https?:\/\/[^\/]+/i, ''));
	};
})();
</script>
<script>
// Hauteurs du menu et du fil d'Ariane (variables CSS utilisées par le sticky). Le menu est construit en JS après le
// chargement et change de hauteur en mobile : on observe les deux éléments plutôt que de mesurer une seule fois.
(function() {
	var nav = document.querySelector('nav.navbar-flat');
	var breadcrumb = document.querySelector('.breadcrumb-sticky');
	function update() {
		var root = document.documentElement.style;
		root.setProperty('--navbar-height', nav.offsetHeight + 'px');
		root.setProperty('--breadcrumb-height', breadcrumb.offsetHeight + 'px');
	}
	update();
	if (window.ResizeObserver) {
		var observer = new ResizeObserver(update);
		observer.observe(nav);
		observer.observe(breadcrumb);
	} else {
		window.addEventListener('resize', update);
		window.addEventListener('load', update);
	}
})();
</script>
<script>
// Frise chronologique : construite à partir des entrées <div class="title" id="annee_AAAA"> (première entrée de chaque année,
// la page est triée de la plus récente à la plus ancienne). L'année affichée = la dernière entrée-année passée sous les barres collées.
(function() {
	var timeline = document.getElementById('timeline');
	var starts = document.querySelectorAll('.title[id^="annee_"]');
	if (!timeline || !starts.length) return;

	var list = timeline.firstElementChild;
	var decades = {};
	var years = [];
	Array.prototype.forEach.call(starts, function(start) {
		var year = parseInt(start.id.slice(6), 10);
		var decade = Math.floor(year / 10) * 10;
		if (!decades[decade]) {
			var item = document.createElement('li');
			item.className = 'tl-decade';
			item.innerHTML = '<a href="#' + start.id + '">' + decade + 's</a><ul></ul>';
			list.appendChild(item);
			decades[decade] = item;
		}
		var li = document.createElement('li');
		li.innerHTML = '<a class="tl-year" href="#' + start.id + '">' + year + '</a>';
		decades[decade].lastElementChild.appendChild(li);
		years.push({ start: start, link: li.firstChild, decade: decades[decade], top: 0 });
	});

	function measure() {
		var scrollY = window.pageYOffset;
		years.forEach(function(y) { y.top = y.start.getBoundingClientRect().top + scrollY; });
		update();
	}

	var current = null;
	function update() {
		var root = getComputedStyle(document.documentElement);
		var offset = (parseFloat(root.getPropertyValue('--navbar-height')) || 50) + (parseFloat(root.getPropertyValue('--breadcrumb-height')) || 40) + 10;
		var line = window.pageYOffset + offset;
		var found = years[0];
		for (var i = 0; i < years.length && years[i].top <= line; i++) found = years[i];
		if (found === current) return;
		if (current) {
			current.link.classList.remove('active');
			current.decade.classList.remove('active');
		}
		current = found;
		current.link.classList.add('active');
		current.decade.classList.add('active');
		// Zoom : plus une ligne est loin de l'année en cours (en nombre de lignes visibles), plus elle est petite et transparente
		var rows = timeline.querySelectorAll('.tl-decade > a, .tl-decade.active a.tl-year');
		var center = Array.prototype.indexOf.call(rows, current.link);
		Array.prototype.forEach.call(rows, function(row, i) {
			var d = i - center;
			row.style.setProperty('--tl-size', (10 + 12 * Math.exp(-d * d / 8)).toFixed(1) + 'px');
			row.style.setProperty('--tl-opacity', (0.25 + 0.75 * Math.exp(-d * d / 18)).toFixed(2));
		});
		// Garde l'année active visible si la frise déborde (sans faire défiler la page)
		var linkTop = current.link.offsetTop, linkBottom = linkTop + current.link.offsetHeight;
		if (linkTop < timeline.scrollTop) timeline.scrollTop = linkTop;
		else if (linkBottom > timeline.scrollTop + timeline.clientHeight) timeline.scrollTop = linkBottom - timeline.clientHeight;
	}

	var ticking = false;
	window.addEventListener('scroll', function() {
		if (ticking) return;
		ticking = true;
		requestAnimationFrame(function() { ticking = false; update(); });
	}, { passive: true });
	window.addEventListener('resize', measure);
	window.addEventListener('load', measure);
	// Le menu est construit en JS après le chargement : la mise en page peut bouger
	if (window.ResizeObserver) new ResizeObserver(measure).observe(document.body);
	measure();
})();
</script>
